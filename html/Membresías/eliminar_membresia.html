<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Membresía</title>
    <link rel="stylesheet" href="../footer.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .contenedor {
            background: #fff;
            padding: 2em;
            max-width: 700px;
            margin: 3em auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .formulario {
            display: flex;
            gap: 1em;
            margin-bottom: 1.5em;
        }
        input[type="number"] {
            flex: 1;
            padding: 0.7em;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            padding: 0.7em 1.5em;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover {
            background: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
            display: none;
        }
        table.visible {
            display: table;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.7em;
            text-align: left;
        }
        th {
            background: #e74c3c;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .mensaje { 
            margin-top: 1em; 
            padding: 1em;
            border-radius: 4px;
            display: none;
            font-weight: bold;
        }
        .mensaje.success { 
            color: #fff;
            background: #27ae60;
            display: block;
        }
        .mensaje.error { 
            color: #fff;
            background: #e74c3c;
            display: block;
        }
        .confirmacion {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 1em;
            border-radius: 4px;
            margin-top: 1em;
            display: none;
        }
        .confirmacion.visible {
            display: block;
        }
        .confirmacion button {
            margin-right: 0.5em;
            width: auto;
        }
        .btn-confirmar {
            background: #e74c3c;
        }
        .btn-confirmar:hover {
            background: #c0392b;
        }
        .btn-cancelar {
            background: #95a5a6;
        }
        .btn-cancelar:hover {
            background: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Eliminar Membresía</h2>
        
        <div class="formulario">
            <input type="number" id="idMembresia" placeholder="Ingrese el ID de la membresía" min="1" required>
            <button onclick="buscarMembresia()">Buscar</button>
        </div>

        <div class="mensaje" id="mensaje"></div>

        <table id="tablaMembresia">
            <thead>
                <tr>
                    <th>Campo</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>

        <div class="confirmacion" id="confirmacion">
            <p><strong>¿Está seguro que desea eliminar esta membresía?</strong> Esta acción no se puede deshacer.</p>
            <button class="btn-confirmar" onclick="confirmarEliminacion()">Confirmar Eliminación</button>
            <button class="btn-cancelar" onclick="cancelarEliminacion()">Cancelar</button>
        </div>
    </div>

    <script>
        let idMembresiaActual = null;

        function buscarMembresia() {
            const idMembresia = document.getElementById('idMembresia').value;
            const mensaje = document.getElementById('mensaje');
            const tabla = document.getElementById('tablaMembresia');
            const cuerpoTabla = document.getElementById('cuerpoTabla');
            const confirmacion = document.getElementById('confirmacion');

            mensaje.className = 'mensaje';
            tabla.classList.remove('visible');
            confirmacion.classList.remove('visible');
            cuerpoTabla.innerHTML = '';

            if (!idMembresia) {
                mensaje.textContent = 'Por favor ingrese un ID de membresía.';
                mensaje.classList.add('error');
                return;
            }

            if (parseInt(idMembresia) <= 0) {
                mensaje.textContent = 'El ID debe ser un número positivo.';
                mensaje.classList.add('error');
                return;
            }

            fetch(`https://192.168.100.8:3000/membresias/${idMembresia}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Membresía no encontrada');
                    }
                    return res.json();
                })
                .then(data => {
                    idMembresiaActual = data.ID_Membresia;
                    const campos = [
                        { nombre: 'ID Membresía', valor: data.ID_Membresia },
                        { nombre: 'Cédula Socio', valor: data.ID_Socio },
                        { nombre: 'Nombre Socio', valor: data.Nombre },
                        { nombre: 'Apellido Socio', valor: data.Apellido },
                        { nombre: 'Plan', valor: data.NombrePlan },
                        { nombre: 'Precio', valor: '$' + parseFloat(data.Precio).toFixed(2) },
                        { nombre: 'Fecha Inicio', valor: data.FechaInicio },
                        { nombre: 'Fecha Fin', valor: data.FechaFin }
                    ];

                    campos.forEach(campo => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `<td><strong>${campo.nombre}</strong></td><td>${campo.valor}</td>`;
                        cuerpoTabla.appendChild(fila);
                    });

                    tabla.classList.add('visible');
                    confirmacion.classList.add('visible');
                    mensaje.textContent = 'Membresía encontrada. ¿Desea eliminarla?';
                    mensaje.classList.add('success');
                })
                .catch(error => {
                    mensaje.textContent = 'Membresía no encontrada.';
                    mensaje.classList.add('error');
                    idMembresiaActual = null;
                });
        }

        function confirmarEliminacion() {
            if (!idMembresiaActual) {
                return;
            }

            const mensaje = document.getElementById('mensaje');
            const confirmacion = document.getElementById('confirmacion');

            fetch(`https://192.168.100.8:3000/eliminar_membresia/${idMembresiaActual}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Error al eliminar la membresía');
                    }
                    return res.json();
                })
                .then(data => {
                    mensaje.className = 'mensaje success';
                    mensaje.textContent = data.mensaje || 'Membresía eliminada correctamente.';
                    confirmacion.classList.remove('visible');
                    document.getElementById('tablaMembresia').classList.remove('visible');
                    document.getElementById('idMembresia').value = '';
                    idMembresiaActual = null;
                })
                .catch(error => {
                    mensaje.className = 'mensaje error';
                    mensaje.textContent = error.message.includes('pagos') ? 'No se puede eliminar: la membresía tiene pagos asociados.' : 'Error al eliminar la membresía.';
                });
        }

        function cancelarEliminacion() {
            const confirmacion = document.getElementById('confirmacion');
            confirmacion.classList.remove('visible');
            idMembresiaActual = null;
        }

        document.getElementById('idMembresia').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarMembresia();
            }
        });
    </script>
    <script src="../footer.js"></script>
</body>
</html>
