<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar Planes de Membresía</title>
    <link rel="stylesheet" href="../footer.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .contenedor {
            background: #fff;
            padding: 2em;
            max-width: 900px;
            margin: 3em auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.7em;
            text-align: left;
        }
        th {
            background: #3498db;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        tr:hover {
            background: #e8f4f8;
        }
        .mensaje { 
            margin-top: 1em; 
            padding: 1em;
            border-radius: 4px;
            display: none;
            font-weight: bold;
        }
        .mensaje.success { 
            color: #fff;
            background: #27ae60;
            display: block;
        }
        .mensaje.error { 
            color: #fff;
            background: #e74c3c;
            display: block;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Consultar Planes de Membresía</h2>
        
        <button onclick="cargarPlanes()" style="padding: 0.7em 1.5em; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">Cargar Planes</button>
        
        <table id="tablaPlanes" style="display: none;">
            <thead>
                <tr>
                    <th>ID Plan</th>
                    <th>Nombre del Plan</th>
                    <th>Duración (días)</th>
                    <th>Precio ($)</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>

        <div class="mensaje" id="mensaje"></div>
    </div>

    <script>
        function cargarPlanes() {
            const mensaje = document.getElementById('mensaje');
            const tabla = document.getElementById('tablaPlanes');
            const cuerpoTabla = document.getElementById('cuerpoTabla');

            mensaje.className = 'mensaje';
            cuerpoTabla.innerHTML = '';
            tabla.style.display = 'none';

            fetch('https://192.168.100.8:3000/planes_membresia')
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Error al consultar los planes');
                    }
                    return res.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        mensaje.className = 'mensaje error';
                        mensaje.textContent = 'No hay planes de membresía registrados.';
                        return;
                    }

                    data.forEach(plan => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${plan.id_plan}</td>
                            <td>${plan.nombreplan}</td>
                            <td>${plan.duraciondias}</td>
                            <td>$${parseFloat(plan.precio).toFixed(2)}</td>
                        `;
                        cuerpoTabla.appendChild(fila);
                    });

                    tabla.style.display = 'table';
                    mensaje.className = 'mensaje success';
                    mensaje.textContent = `Se encontraron ${data.length} planes de membresía.`;
                })
                .catch(error => {
                    mensaje.className = 'mensaje error';
                    mensaje.textContent = 'Error al consultar los planes.';
                });
        }

        // Cargar planes automáticamente al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            cargarPlanes();
        });
    </script>
    <script src="../footer.js"></script>
</body>
</html>
