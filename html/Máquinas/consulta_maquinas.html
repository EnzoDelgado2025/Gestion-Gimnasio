<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Máquinas</title>
    <link rel="stylesheet" href="../footer.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .tabla-container {
            background: #fff;
            padding: 2em;
            max-width: 1000px;
            margin: 3em auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.7em;
            text-align: center;
        }
        th {
            background: #007bff;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        img {
            max-width: 120px;
            max-height: 80px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="tabla-container">
        <h2>Máquinas Registradas</h2>
        <table id="tablaMaquinas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Último Mantenimiento</th>
                    <th>Estado Operativo</th>
                    <th>Imagen</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se insertarán las filas -->
            </tbody>
        </table>
    </div>
    <script>
        async function cargarMaquinas() {
            const tabla = document.getElementById('tablaMaquinas').getElementsByTagName('tbody')[0];
            tabla.innerHTML = '';
            try {
                const res = await fetch('https://192.168.100.8:3000/maquinas');
                const maquinas = await res.json();
                if (Array.isArray(maquinas)) {
                    maquinas.forEach(m => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${m.id_maquina}</td>
                            <td>${m.nombre}</td>
                            <td>${m.tipo}</td>
                            <td>${m.ultimomantenimiento ? m.ultimomantenimiento.split('T')[0] : ''}</td>
                            <td>${m.estadooperativo}</td>
                            <td>${m.imagen ? `<img src="${m.imagen}" alt="Imagen máquina">` : ''}</td>
                        `;
                        tabla.appendChild(fila);
                    });
                }
            } catch (err) {
                tabla.innerHTML = '<tr><td colspan="6" style="color:#d00;">No se pudo cargar la información</td></tr>';
            }
        }
        window.onload = cargarMaquinas;
    </script>
    <script src="../footer.js"></script>
</body>
</html>
