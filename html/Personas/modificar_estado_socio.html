<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Estado de Socio</title>
    <link rel="stylesheet" href="../footer.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .contenedor {
            background: #fff;
            padding: 2em;
            max-width: 800px;
            margin: 3em auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .formulario {
            display: flex;
            gap: 1em;
            margin-bottom: 2em;
            flex-wrap: wrap;
        }
        input[type="text"], select {
            flex: 1;
            min-width: 200px;
            padding: 0.7em;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            padding: 0.7em 1.5em;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
            display: none;
        }
        table.visible {
            display: table;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.7em;
            text-align: left;
        }
        th {
            background: #007bff;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .mensaje { 
            margin-top: 1em; 
            color: #d00; 
            font-weight: bold; 
            padding: 1em;
            border-radius: 4px;
            display: none;
        }
        .mensaje.success { 
            color: #fff;
            background: #27ae60;
            display: block;
        }
        .mensaje.error { 
            color: #fff;
            background: #e74c3c;
            display: block;
        }
        .seccion {
            margin-top: 2em;
        }
        .seccion h3 {
            color: #2c3e50;
            border-bottom: 2px solid #007bff;
            padding-bottom: 0.5em;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Modificar Estado de Socio</h2>
        
        <div class="seccion">
            <h3>Buscar Socio</h3>
            <div class="formulario">
                <input type="text" id="idSocio" placeholder="Ingrese el ID del socio (cédula)" pattern="^[0-9]{10}$" maxlength="10" minlength="10" required title="Debe tener exactamente 10 dígitos numéricos" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <button onclick="buscarSocio()">Buscar</button>
            </div>
        </div>

        <div class="mensaje" id="mensaje"></div>

        <table id="tablaSocio">
            <thead>
                <tr>
                    <th>Campo</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>

        <div class="seccion" id="seccionModificar" style="display: none;">
            <h3>Modificar Estado</h3>
            <div class="formulario">
                <select id="nuevoEstado" required>
                    <option value="">Seleccione nuevo estado...</option>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
                <button onclick="modificarEstado()">Actualizar Estado</button>
            </div>
        </div>
    </div>

    <script>
        let idSocioActual = null;

        function buscarSocio() {
            const idSocio = document.getElementById('idSocio').value.trim();
            const mensaje = document.getElementById('mensaje');
            const tabla = document.getElementById('tablaSocio');
            const cuerpoTabla = document.getElementById('cuerpoTabla');
            const seccionModificar = document.getElementById('seccionModificar');

            mensaje.className = 'mensaje';
            tabla.classList.remove('visible');
            seccionModificar.style.display = 'none';
            cuerpoTabla.innerHTML = '';

            if (!idSocio) {
                mensaje.textContent = 'Por favor ingrese un ID de socio.';
                mensaje.classList.add('error');
                return;
            }

            // Validación JS extra: solo números y exactamente 10 dígitos
            if (!/^[0-9]{10}$/.test(idSocio)) {
                mensaje.textContent = 'El ID debe tener exactamente 10 dígitos numéricos.';
                mensaje.classList.add('error');
                return;
            }

            fetch(`https://192.168.100.8:3000/consulta_socios/${idSocio}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Socio no encontrado');
                    }
                    return res.json();
                })
                .then(data => {
                    idSocioActual = data.id_persona;
                    const campos = [
                        { nombre: 'ID Persona', valor: data.id_persona },
                        { nombre: 'Nombre', valor: data.nombre },
                        { nombre: 'Apellido', valor: data.apellido },
                        { nombre: 'Email', valor: data.email },
                        { nombre: 'Fecha de Registro', valor: data.fecharegistro },
                        { nombre: 'Estado Actual', valor: data.estado }
                    ];

                    campos.forEach(campo => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `<td><strong>${campo.nombre}</strong></td><td>${campo.valor || 'N/A'}</td>`;
                        cuerpoTabla.appendChild(fila);
                    });

                    tabla.classList.add('visible');
                    seccionModificar.style.display = 'block';
                    // Establecer el estado actual como seleccionado
                    document.getElementById('nuevoEstado').value = data.estado;
                    mensaje.textContent = 'Socio encontrado. Puede modificar su estado.';
                    mensaje.classList.add('success');
                })
                .catch(error => {
                    mensaje.textContent = error.message === 'Socio no encontrado' ? 'Socio no encontrado.' : 'Error al consultar el socio.';
                    mensaje.classList.add('error');
                    idSocioActual = null;
                });
        }

        function modificarEstado() {
            const nuevoEstado = document.getElementById('nuevoEstado').value;
            const mensaje = document.getElementById('mensaje');

            if (!idSocioActual) {
                mensaje.className = 'mensaje error';
                mensaje.textContent = 'Por favor busque primero un socio.';
                return;
            }

            if (!nuevoEstado) {
                mensaje.className = 'mensaje error';
                mensaje.textContent = 'Por favor seleccione un nuevo estado.';
                return;
            }

            fetch(`https://192.168.100.8:3000/modificar_estado_socio/${idSocioActual}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Estado: nuevoEstado })
            })
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Error al modificar el estado');
                    }
                    return res.json();
                })
                .then(data => {
                    mensaje.className = 'mensaje success';
                    mensaje.textContent = 'Estado del socio actualizado correctamente.';
                    // Recargar los datos del socio
                    setTimeout(() => {
                        buscarSocio();
                    }, 1500);
                })
                .catch(error => {
                    mensaje.className = 'mensaje error';
                    mensaje.textContent = 'Error al modificar el estado del socio.';
                });
        }

        // Permitir búsqueda con Enter
        document.getElementById('idSocio').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarSocio();
            }
        });
    </script>
    <script src="../footer.js"></script>
</body>
</html>
